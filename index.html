<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورقة</title>
  <meta name="theme-color" content="#1F4D4A" />
  <style>
    :root { --paper:#F6F3EC; --cream:#FBF9F4; --ink:#1C1915; --muted:#6B645C; --teal:#1F4D4A; --line:#D7D0C4; --warn:#8B3A3A; --ok:#2E7A63; }
    *{box-sizing:border-box} html,body{margin:0;background:#E8E2D6;color:var(--ink);font-family:"IBM Plex Sans Arabic","Noto Naskh Arabic","Amiri","Traditional Arabic",sans-serif}
    a{color:inherit;text-decoration:none} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
    .top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
    .brand{font-weight:700} .nav{display:flex;flex-wrap:wrap;gap:8px}
    .nav a,.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 12px;border-radius:6px}
    .nav a.active,.btn-main{background:var(--teal);color:var(--paper);border-color:var(--teal)}
    .page{max-width:1100px;margin:0 auto;padding:28px 16px 72px}
    h1{font-size:clamp(28px,4vw,40px);line-height:1.25;margin:8px 0} .muted{color:var(--muted)}
    .row{display:flex;flex-wrap:wrap;gap:8px} .grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
    .ink{background:var(--ink);color:var(--paper);border-radius:14px;padding:20px} .list{display:grid;gap:10px}
    label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
    input,select,textarea{width:100%;background:var(--cream);border:1px solid var(--line);padding:8px 10px;color:var(--ink);text-align:start}
    .warn{color:var(--warn)} .ok{color:var(--ok)} .badge{font-size:12px;border:1px solid currentColor;padding:2px 8px;border-radius:999px}
    .sheet{background:var(--paper);border:1px solid var(--line);padding:36px 40px;min-height:800px}
    .head{display:grid;grid-template-columns:1fr auto;gap:16px;border-bottom:2px solid var(--teal);padding-bottom:12px}
    .seal{width:74px;height:74px;border:2px solid var(--teal);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--teal);font-size:12px;overflow:hidden}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:16px 0 22px}
    .q{margin:0 0 18px;text-align:start}
    .split{display:grid;gap:16px;grid-template-columns:minmax(280px,340px) 1fr}
    @media (max-width:900px){.split{grid-template-columns:1fr}}
    @media print{.top,.no-print{display:none!important} body{background:#fff} .sheet{border:0}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top no-print"><div class="brand">ورقة</div><nav class="nav" id="nav"></nav></header>
  <div id="app"></div>
</div>
<script src="app.js"></script>
</body>
</html>
