<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ورقة</title>
<meta name="theme-color" content="#1F4D4A"/>
<style>
:root{--paper:#F6F3EC;--raised:#FBF9F4;--ink:#1C1915;--muted:#6B645C;--teal:#1F4D4A;--line:#D7D0C4;--crimson:#8B3A3A}
*{box-sizing:border-box}html,body{margin:0;background:#E8E2D6;color:var(--ink);font-family:"IBM Plex Sans Arabic","Noto Naskh Arabic","Amiri","Traditional Arabic",serif}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-weight:700;color:var(--teal)}.nav a{border:1px solid var(--ink);padding:7px 10px;margin-inline-start:6px;display:inline-block}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 72px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button.main{background:var(--teal);color:var(--paper);border:1px solid var(--teal);padding:10px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:10px 14px;font:inherit;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--paper);border:1px solid var(--line);padding:14px}
.muted{color:var(--muted);font-size:13px}.err{color:var(--crimson)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--raised);border:1px solid var(--line);color:var(--ink);padding:8px 10px;font:inherit;text-align:start;direction:rtl}
textarea{min-height:88px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px}@media(max-width:860px){.layout,.stats{grid-template-columns:1fr}}
.sheet{background:#fff;border:1px solid var(--line);padding:28px 30px;min-height:680px}
.head{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:2px solid var(--teal);padding-bottom:10px}
.seal{width:74px;height:74px;border:2px solid var(--teal);border-radius:50%;display:grid;place-items:center;color:var(--teal);text-align:center;font-size:12px}
table.meta{width:100%;border-collapse:collapse;margin:12px 0 16px}table.meta td{border:1px solid var(--ink);padding:4px 6px}
.q{margin:0 0 14px;text-align:start}.end{text-align:center;margin-top:24px}
ul.list{list-style:none;padding:0;margin:0}ul.list li{background:var(--paper);border:1px solid var(--line);padding:12px;margin:8px 0;cursor:pointer}
@media print{.top,.panel,.row,.nav{display:none!important}body{background:#fff}.sheet{border:0}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">ورقة</div><div class="muted">أداة محلية · البيانات على هذا الجهاز فقط</div></div>
  <nav class="nav"><a href="#/">الرئيسية</a><a href="#/bank">البنك</a><a href="#/settings">الإعدادات</a></nav>
</header>
<div class="wrap" id="app"></div>
<script>
const KEY="waraqa-v1";
const L="أبجدهوز";
const demoQs=[
  {id:"q1",type:"mcq",stem:"عاصمة المملكة العربية السعودية هي:",options:["الرياض","جدة","الدمام","مكة"],score:4},
  {id:"q2",type:"blank",stem:"عاصمة المملكة هي [[الرياض]]",score:4},
  {id:"q3",type:"tf",stem:"تقع الرياض في وسط الجزيرة العربية.",score:4},
  {id:"q4",type:"open",stem:"علل: تُعد المملكة ملتقى للقارات الثلاث.",score:4},
  {id:"q5",type:"open",stem:"حل المعادلة $x^2+1=0$ يُكتب كنص داخل السؤال.",score:4}
];
function demo(){return{school:{name:"مدرسة النور الأهلية"},questions:demoQs,exams:[{id:"exam_social_final",title:"اختبار الدراسات الاجتماعية",subject:"الدراسات الاجتماعية",grade:"الصف الخامس",term:"الفصل الدراسي الأول",minutes:"45",total:20,qids:demoQs.map(q=>q.id)}]}}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||"null");if(raw&&raw.state&&Array.isArray(raw.state.exams))return{school:raw.state.school||demo().school,questions:raw.state.questions||[],exams:raw.state.exams||[]};if(raw&&raw.exams)return raw}catch(e){}return demo()}
let S=load();
function save(){localStorage.setItem(KEY,JSON.stringify({state:{school:S.school,questions:S.questions,exams:S.exams,theme:"light"},version:1}))}
function uid(p){return p+"_"+Math.random().toString(36).slice(2,8)}
function route(){const h=(location.hash||"#/").slice(1)||"/";const m=h.match(/^\/exams\/([^/]+)(\/preview)?/);if(m)return{name:m[2]?"preview":"exam",id:decodeURIComponent(m[1])};if(h==="/bank")return{name:"bank"};if(h==="/settings")return{name:"settings"};return{name:"home"}}
function go(p){location.hash=p}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]))}
function stemHtml(s){return esc(s).replace(/\[\[([^\]]+)\]\]/g,'<span style="border-bottom:1px solid #1C1915;min-width:5rem;display:inline-block"></span>')}
function examBy(id){return S.exams.find(e=>e.id===id)}
function qsOf(e){return (e.qids||[]).map(id=>S.questions.find(q=>q.id===id)).filter(Boolean)}
function sum(e){return qsOf(e).reduce((a,q)=>a+(Number(q.score)||0),0)}
function validate(e){const t=Number(e.total||0),s=sum(e);return t&&s!==t?"مجموع الدرجات "+s+" بينما المطلوب "+t:""}
function paper(e){const qs=qsOf(e);const rows=`<tr><td>المادة</td><td>${esc(e.subject)}</td><td>الصف</td><td>${esc(e.grade)}</td></tr><tr><td>الفصل</td><td>${esc(e.term)}</td><td>المدة</td><td>${esc(e.minutes)} دقيقة</td></tr><tr><td>الدرجة</td><td>${esc(e.total)}</td><td>النموذج</td><td>أ</td></tr>`;
const body=qs.map((q,i)=>{let extra="";if(q.type==="mcq")extra="<p>"+(q.options||[]).map((o,j)=>(L[j]||(j+1))+") "+esc(o)).join("<br>")+"</p>";if(q.type==="tf")extra="<p>صواب / خطأ</p>";if(q.type==="match")extra="<p>"+(q.pairs||[]).map(p=>esc(p.l)+" — ……").join("<br>")+"</p>";return `<div class="q"><b>${i+1}) ${stemHtml(q.stem)}</b> <span class="muted">(${q.score})</span>${extra}</div>`}).join("");
return `<article class="sheet"><div class="head"><div><div style="font-size:20px;font-weight:700">${esc(S.school.name)}</div><div>${esc(e.title)}</div></div><div class="seal">ختم<br>المدرسة</div></div><table class="meta">${rows}</table>${body}<p class="end">انتهت الأسئلة — تمنياتنا بالتوفيق</p><p class="muted">الملف Word قابل للتحرير واتجاهه عربي داخل خصائص الملف. راجعْه في Microsoft Word قبل الطباعة. لا نضمن كل العارضات.</p></article>`}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xffffffff;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xffffffff)>>>0}
function u16(n){return Uint8Array.of(n&255,(n>>8)&255)}function u32(n){return Uint8Array.of(n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255)}
function cat(ps){const n=ps.reduce((a,p)=>a+p.length,0),o=new Uint8Array(n);let i=0;for(const p of ps){o.set(p,i);i+=p.length}return o}
function zip(files){const L=[],C=[];let off=0;for(const f of files){const name=new TextEncoder().encode(f.name),data=f.data,crc=crc32(data);
const loc=cat([Uint8Array.of(80,75,3,4),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
L.push(loc);C.push(cat([Uint8Array.of(80,75,1,2),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),name]));off+=loc.length}
const loc=cat(L),cen=cat(C);return cat([loc,cen,cat([Uint8Array.of(80,75,5,6),u16(0),u16(0),u16(files.length),u16(files.length),u32(cen.length),u32(loc.length),u16(0)])])}
function p(text,bold){const b=bold?"<w:b/><w:bCs/>":"";return `<w:p><w:pPr><w:bidi w:val="1"/><w:jc w:val="start"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Traditional Arabic" w:hint="cs"/><w:rtl/><w:sz w:val="24"/><w:szCs w:val="24"/>${b}</w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>`}
function docx(e){const qs=qsOf(e);const parts=[p(S.school.name,true),p(e.title,true),p(`المادة: ${e.subject}    الصف: ${e.grade}`),p(`الفصل: ${e.term}    المدة: ${e.minutes} دقيقة    الدرجة: ${e.total}`),p("")];
qs.forEach((q,i)=>{parts.push(p(`${i+1}) ${String(q.stem).replace(/\[\[([^\]]+)\]\]/g,"__________")} (${q.score})`,true));(q.options||[]).forEach((o,j)=>parts.push(p(`${L[j]}) ${o}`)));if(q.type==="tf")parts.push(p("صواب / خطأ"))});
parts.push(p(""),p("انتهت الأسئلة — تمنياتنا بالتوفيق"));
const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${parts.join("")}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:bidi w:val="1"/></w:sectPr></w:body></w:document>`;
const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:cs="Traditional Arabic" w:hint="cs"/><w:rtl/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:bidi w:val="1"/><w:jc w:val="start"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`;
const settings=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:themeFontLang w:val="ar-SA" w:bidi="ar-SA"/><w:bidi/></w:settings>`;
const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>`;
const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
const drels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/></Relationships>`;
const enc=new TextEncoder();
return zip([{name:"[Content_Types].xml",data:enc.encode(types)},{name:"_rels/.rels",data:enc.encode(rels)},{name:"word/document.xml",data:enc.encode(documentXml)},{name:"word/_rels/document.xml.rels",data:enc.encode(drels)},{name:"word/styles.xml",data:enc.encode(styles)},{name:"word/settings.xml",data:enc.encode(settings)}])}
function dl(name,bytes){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}));a.download=name;a.click()}
function render(){
const r=route(),el=document.getElementById("app");
if(r.name==="home"){
el.innerHTML=`<h1>اختبار عربي جاهز للطباعة خلال دقائق</h1><p class="muted">أنشئ من البنك أو أضف سؤالًا، اكتب الغلاف فوق القالب، ثم نزّل Word.</p>
<div class="row"><button class="main" id="new">إنشاء اختبار</button><button class="ghost" id="ready">معاينة النموذج الجاهز</button></div>
<div class="stats"><div class="card"><div class="muted">أسئلة في البنك</div><div style="font-size:28px">${S.questions.length}</div></div><div class="card"><div class="muted">اختبارات محفوظة</div><div style="font-size:28px">${S.exams.length}</div></div><div class="card"><div class="muted">أنواع الأسئلة</div><div style="font-size:28px">6</div></div></div>
<h2>الاختبارات</h2><ul class="list">${S.exams.map(e=>`<li data-id="${esc(e.id)}"><b>${esc(e.title)}</b><div class="muted">${esc(e.subject)} · ${qsOf(e).length} أسئلة · ${validate(e)||"جاهز للتصدير"}</div></li>`).join("")||"<p class='muted'>لا توجد اختبارات بعد.</p>"}</ul>`;
el.querySelector("#new").onclick=()=>{const e={id:uid("exam"),title:"اختبار جديد",subject:"",grade:"",term:"الفصل الدراسي الأول",minutes:"45",total:20,qids:[]};S.exams.unshift(e);save();go("/exams/"+e.id)};
el.querySelector("#ready").onclick=()=>go("/exams/exam_social_final/preview");
el.querySelectorAll("ul.list li").forEach(li=>li.onclick=()=>go("/exams/"+li.dataset.id));return}
if(r.name==="bank"){
el.innerHTML=`<h1>بنك الأسئلة</h1><div class="layout"><div class="card"><label>نص السؤال</label><textarea id="stem"></textarea><label>النوع</label><select id="type"><option value="mcq">اختيار من متعدد</option><option value="tf">صح وخطأ</option><option value="blank">إكمال فراغ</option><option value="open">مقال</option><option value="short">إجابة قصيرة</option><option value="match">مقارنة</option></select><label>الخيارات مفصولة بـ |</label><input id="opts" placeholder="الرياض | جدة | الدمام"/><label>الدرجة</label><input id="sc" value="2"/><button class="main" id="add">إضافة للبنك</button></div><ul class="list">${S.questions.map(q=>`<li><b>${esc(q.stem)}</b><div class="muted">${q.type} · ${q.score}</div></li>`).join("")}</ul></div>`;
el.querySelector("#add").onclick=()=>{const type=el.querySelector("#type").value,stem=el.querySelector("#stem").value.trim();if(!stem)return;if(type==="blank"&&!/\[\[.+\]\]/.test(stem)){alert("اكتب الفراغ هكذا: عاصمة المملكة هي [[الرياض]]");return}const opts=el.querySelector("#opts").value.split("|").map(s=>s.trim()).filter(Boolean);const q={id:uid("q"),type,stem,score:Number(el.querySelector("#sc").value)||1};if(type==="mcq")q.options=opts;if(type==="match")q.pairs=opts.map((o,i)=>({l:o,r:""}));S.questions.unshift(q);save();render()};return}
if(r.name==="settings"){
el.innerHTML=`<h1>الإعدادات</h1><label>اسم المدرسة</label><input id="school" value="${esc(S.school.name)}"/><div class="row"><button class="main" id="saveSch">حفظ</button><button class="ghost" id="wipe">حذف كل البيانات المحلية</button><button class="ghost" id="demo">إعادة المثال</button></div><p class="muted">لا حساب سحابي. المسح يفرّغ هذا المتصفح فقط. لا تحليلات ولا CDN.</p>`;
el.querySelector("#saveSch").onclick=()=>{S.school.name=el.querySelector("#school").value;save();render()};
el.querySelector("#wipe").onclick=()=>{S={school:{name:""},questions:[],exams:[]};localStorage.removeItem(KEY);save();render()};
el.querySelector("#demo").onclick=()=>{S=demo();save();render()};return}
const exam=examBy(r.id);if(!exam){el.innerHTML="<p>الاختبار غير موجود.</p>";return}
if(r.name==="preview"){
el.innerHTML=`<div class="row"><button class="main" id="word">تنزيل Word</button><button class="ghost" id="pdf">طباعة / PDF</button><button class="ghost" id="back">تعديل الغلاف</button></div><p class="err">${validate(exam)}</p>${paper(exam)}`;
el.querySelector("#word").onclick=()=>dl((exam.title||"waraqa")+".docx",docx(exam));
el.querySelector("#pdf").onclick=()=>window.print();
el.querySelector("#back").onclick=()=>go("/exams/"+exam.id);return}
el.innerHTML=`<div class="layout"><div class="card panel"><label>عنوان الاختبار</label><input id="title" value="${esc(exam.title)}"/><label>المادة</label><input id="subject" value="${esc(exam.subject)}"/><label>الصف</label><input id="grade" value="${esc(exam.grade)}"/><label>الفصل</label><input id="term" value="${esc(exam.term)}"/><label>المدة</label><input id="minutes" value="${esc(exam.minutes)}"/><label>مجموع الدرجات</label><input id="total" value="${esc(exam.total)}"/><p class="err">${validate(exam)}</p><div class="row"><button class="main" id="save">كتابة البيانات فوق القالب</button><button class="ghost" id="prev">معاينة وتصدير</button></div><h3>أسئلة البنك</h3>${S.questions.map(q=>`<label><input type="checkbox" data-qid="${q.id}" ${exam.qids.includes(q.id)?"checked":""}/> ${esc(q.stem)}</label>`).join("")}</div>${paper(exam)}</div>`;
const grab=()=>{exam.title=el.querySelector("#title").value;exam.subject=el.querySelector("#subject").value;exam.grade=el.querySelector("#grade").value;exam.term=el.querySelector("#term").value;exam.minutes=el.querySelector("#minutes").value;exam.total=Number(el.querySelector("#total").value)||0;exam.qids=[...el.querySelectorAll("input[data-qid]:checked")].map(i=>i.dataset.qid);save()};
el.querySelector("#save").onclick=()=>{grab();render()};
el.querySelector("#prev").onclick=()=>{grab();go("/exams/"+exam.id+"/preview")}
}
addEventListener("hashchange",render);if(!location.hash)location.hash="/";else render();
</script>
</body>
</html>
